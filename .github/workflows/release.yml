name: Release

# Cross-platform installer build + publish.
#
# Triggers:
#   - Pushing a tag that starts with "v" (e.g. v0.1.0) or a branch named
#     "release/vX.Y.Z" — builds and publishes a GitHub Release with
#     installers attached.
#   - Manual dispatch with a tag_name input — builds + publishes a release.
#
# This workflow does NOT run on plain branch pushes (main or feature branches).
# Releases are driven exclusively by tags: auto-tag.yml runs on every push to
# main, bumps the patch version, creates a tag, and dispatches this workflow
# with that tag — which then builds + publishes the release.
#
# Outputs per platform:
#   - windows-latest : .msi + .exe (NSIS)
#   - macos-latest   : .dmg + .app.tar.gz (universal-ish — arm64 runner)
#   - ubuntu-22.04   : .AppImage + .deb

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute release tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "tag=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "::error::No release tag could be resolved from trigger context"
            exit 1
          fi

  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify updater signing key is configured
        # bundle.createUpdaterArtifacts is on in tauri.conf.json, so the
        # bundler will refuse to build without TAURI_SIGNING_PRIVATE_KEY.
        # Fail with a clear, actionable message instead of an obscure bundler error.
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY repository secret is missing — generate a key with 'npx @tauri-apps/cli signer generate -w ./yank.key', then add the private key content as TAURI_SIGNING_PRIVATE_KEY and the passphrase as TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repo Settings → Secrets. Public key goes in tauri.conf.json under plugins.updater.pubkey."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm test

  bump-version:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version files on main
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Bumping version to $VERSION on main"

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

          perl -pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to $VERSION [skip ci]" || true
          git push origin main || true

  build:
    needs: [prepare, check, bump-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos
            bundles: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
            bundles: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Set release version
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

          # Portable in-place edit: BSD sed (macOS) and GNU sed (Linux) disagree
          # on `-i` semantics, so route the rewrite through perl which behaves
          # identically on every runner.
          perl -pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build Tauri release bundles
        shell: bash
        env:
          # Required by bundle.createUpdaterArtifacts to produce .sig files.
          # The check job already gated on these being non-empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ matrix.bundles }}" ]; then
            npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npm run tauri -- build --target ${{ matrix.target }}
          fi

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          shopt -s nullglob
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          assets=""
          # Allowlist by extension — the bundler writes intermediate helpers
          # (e.g. dmg/bundle_dmg.sh, macos/icon.icns) into these dirs that
          # must NOT be uploaded. Match only the installers and their `.sig`
          # companions the updater can consume.
          for f in \
            "$dir"/msi/*.msi "$dir"/msi/*.msi.sig "$dir"/msi/*.msi.zip "$dir"/msi/*.msi.zip.sig \
            "$dir"/nsis/*-setup.exe "$dir"/nsis/*-setup.exe.sig "$dir"/nsis/*.nsis.zip "$dir"/nsis/*.nsis.zip.sig \
            "$dir"/dmg/*.dmg \
            "$dir"/appimage/*.AppImage "$dir"/appimage/*.AppImage.sig \
            "$dir"/appimage/*.AppImage.tar.gz "$dir"/appimage/*.AppImage.tar.gz.sig \
            "$dir"/deb/*.deb "$dir"/deb/*.deb.sig \
            "$dir"/macos/*.app.tar.gz "$dir"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && assets+="$f"$'\n'
          done
          assets="${assets%$'\n'}"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$assets" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build updater manifest fragment
        id: fragment
        shell: bash
        run: |
          shopt -s nullglob
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          target="${{ matrix.target }}"

          # Map Rust target triple → Tauri updater platform key.
          case "$target" in
            aarch64-apple-darwin)        platform="darwin-aarch64" ;;
            x86_64-apple-darwin)         platform="darwin-x86_64" ;;
            x86_64-pc-windows-msvc)      platform="windows-x86_64" ;;
            aarch64-pc-windows-msvc)     platform="windows-aarch64" ;;
            x86_64-unknown-linux-gnu)    platform="linux-x86_64" ;;
            aarch64-unknown-linux-gnu)   platform="linux-aarch64" ;;
            *) echo "::warning::Unrecognised target $target — skipping manifest fragment"; exit 0 ;;
          esac

          # First `.sig` wins per platform. The bundler emits exactly one per
          # updater-eligible installer; if both .app.tar.gz.sig and .dmg.sig
          # appear (future tauri versions), the .app.tar.gz one is preferred.
          #
          # Tauri v2 (modern, createUpdaterArtifacts: true) signs the installer
          # directly: NSIS → `*-setup.exe` + `*-setup.exe.sig`, MSI → `*.msi` +
          # `*.msi.sig`. The `.nsis.zip`/`.msi.zip` names are the legacy
          # v1-compatible format — kept here as fallbacks for older toolchains.
          sig_path=""
          for candidate in \
            "$dir"/macos/*.app.tar.gz.sig \
            "$dir"/nsis/*-setup.exe.sig \
            "$dir"/nsis/*.nsis.zip.sig \
            "$dir"/msi/*.msi.sig \
            "$dir"/msi/*.msi.zip.sig \
            "$dir"/appimage/*.AppImage.tar.gz.sig \
            "$dir"/appimage/*.AppImage.sig; do
            if [ -f "$candidate" ]; then
              sig_path="$candidate"
              break
            fi
          done

          if [ -z "$sig_path" ]; then
            echo "No .sig file found for $target — skipping fragment (signing key likely not set)."
            exit 0
          fi

          binary_path="${sig_path%.sig}"
          binary_name="$(basename "$binary_path")"
          sig_content="$(cat "$sig_path")"
          tag="${{ needs.prepare.outputs.tag }}"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${binary_name}"

          mkdir -p manifest-fragments
          out="manifest-fragments/${platform}.json"
          jq -n \
            --arg platform "$platform" \
            --arg signature "$sig_content" \
            --arg url "$url" \
            '{($platform): {signature: $signature, url: $url}}' > "$out"

          echo "Wrote fragment for $platform → $out"
          cat "$out"

      - name: Upload manifest fragment
        if: hashFiles('manifest-fragments/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.label }}
          path: manifest-fragments/*.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ steps.assets.outputs.files }}

  publish-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fragments
          pattern: updater-fragment-*
          merge-multiple: true

      - name: Stitch fragments into latest.json
        id: stitch
        shell: bash
        run: |
          shopt -s nullglob
          frags=(fragments/*.json)
          if [ ${#frags[@]} -eq 0 ]; then
            echo "No fragments produced — signing keys are probably not configured."
            echo "Skipping latest.json publish; existing one (if any) remains the source of truth."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${{ needs.prepare.outputs.tag }}"
          version="${tag#v}"

          platforms=$(jq -s 'add' "${frags[@]}")
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: "See release notes on GitHub.", pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Generated latest.json:"
          cat latest.json

      - name: Attach latest.json to release
        if: steps.stitch.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: true
          files: latest.json

  update-homebrew-cask:
    # Publishes a refreshed Casks/yank.rb to piyushpradhan/homebrew-yank so
    # `brew upgrade --cask yank` picks up new releases. Skipped when the
    # cross-repo PAT is missing so the rest of the pipeline still ships.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask update. Add a fine-grained PAT with Contents:write on piyushpradhan/homebrew-yank to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap repo
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: piyushpradhan/homebrew-yank
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite Casks/yank.rb
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${tag#v}"
          dmg_url="https://github.com/${{ github.repository }}/releases/download/${tag}/Yank_${version}_aarch64.dmg"

          echo "Downloading $dmg_url"
          curl -fL "$dmg_url" -o yank.dmg
          sha="$(shasum -a 256 yank.dmg | awk '{print $1}')"
          echo "SHA256: $sha"

          mkdir -p tap/Casks
          cat > tap/Casks/yank.rb <<EOF
          cask "yank" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/piyushpradhan/yank/releases/download/v#{version}/Yank_#{version}_aarch64.dmg",
                verified: "github.com/piyushpradhan/yank/"
            name "Yank"
            desc "Clipboard manager with natural-language search"
            homepage "https://yankapp.io"

            livecheck do
              url "https://github.com/piyushpradhan/yank/releases/latest"
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: ">= :big_sur"
            depends_on arch: :arm64

            app "Yank.app"

            # Tauri ships the macOS bundle linker-signed with no sealed
            # resources, which macOS rejects as "damaged" on first launch.
            # Strip any stray xattrs Brew may have left, then re-apply a
            # proper ad-hoc signature with sealed resources so the validity
            # check passes. No Developer ID needed.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Yank.app"]
              system_command "/usr/bin/codesign",
                             args: ["--force", "--deep", "--sign", "-", "#{appdir}/Yank.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.getyank.app",
              "~/Library/Caches/com.getyank.app",
              "~/Library/Logs/Yank",
              "~/Library/Preferences/com.getyank.app.plist",
              "~/Library/Saved Application State/com.getyank.app.savedState",
            ]
          end
          EOF

      - name: Commit + push to tap
        if: steps.gate.outputs.skip != 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/yank.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "yank ${{ needs.prepare.outputs.tag }}"
          git push origin HEAD
