name: Release

# Cross-platform installer build + publish.
#
# Triggers:
#   - Pushing a tag that starts with "v" (e.g. v0.1.0) or a branch named
#     "release/vX.Y.Z" — builds and publishes a GitHub Release with
#     installers attached.
#   - Manual dispatch with a tag_name input — builds + publishes a release.
#
# This workflow does NOT run on plain branch pushes (main or feature branches).
# Releases are driven exclusively by tags: auto-tag.yml runs on every push to
# main, bumps the patch version, creates a tag, and dispatches this workflow
# with that tag — which then builds + publishes the release.
#
# Outputs per platform:
#   - windows-latest : .msi + .exe (NSIS)
#   - macos-latest   : .dmg + .app.tar.gz (universal-ish — arm64 runner)
#   - ubuntu-22.04   : .AppImage + .deb

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute release tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "tag=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "::error::No release tag could be resolved from trigger context"
            exit 1
          fi

  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm test

  bump-version:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version files on main
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Bumping version to $VERSION on main"

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

          perl -pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to $VERSION [skip ci]" || true
          git push origin main || true

  build:
    needs: [prepare, check, bump-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos
            bundles: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
            bundles: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Set release version
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

          # Portable in-place edit: BSD sed (macOS) and GNU sed (Linux) disagree
          # on `-i` semantics, so route the rewrite through perl which behaves
          # identically on every runner.
          perl -pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build Tauri release bundles
        shell: bash
        run: |
          if [ -n "${{ matrix.bundles }}" ]; then
            npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npm run tauri -- build --target ${{ matrix.target }}
          fi

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          shopt -s nullglob
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          assets=""
          for sub in msi nsis dmg appimage deb; do
            for f in "$dir/$sub"/*; do
              [ -f "$f" ] && assets+="$f"$'\n'
            done
          done
          assets="${assets%$'\n'}"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$assets" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ steps.assets.outputs.files }}
